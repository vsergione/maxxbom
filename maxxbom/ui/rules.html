<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <link rel="stylesheet" href="rules.css">
  <title>BOM ruleset editor</title>
</head>
<body>
  <div id="catalog-source-warning" class="catalog-banner catalog-banner--warning" style="display: none;" aria-hidden="true"></div>
  <div id="catalog-api-error" class="catalog-banner catalog-banner--error" style="display: none;" aria-hidden="true"></div>
  <div id="empty-selection-message" class="empty-selection-message">
    Nothing selected
  </div>
  <div id="toolbar-actions" class="toolbar-actions hidden" aria-hidden="true">
    <button type="button" id="btn-add-item" class="btn-add-item" onclick="addItem()">➕ Add rule</button>
    <button type="button" id="btn-save" class="btn-save hidden" onclick="saveRules()">💾 Save</button>
  </div>
  <div id="exportable-wrap" class="exportable-wrap hidden" aria-hidden="true">
    <label id="exportable-label" class="exportable-label">
      <input type="checkbox" id="exportable-flag" checked>
      <span>Exportable</span>
    </label>
    <label id="traversable-label" class="exportable-label" title="Open this component and export the components inside it. This component has no measurement rules.">
      <input type="checkbox" id="traversable-flag">
      <span>Traversable</span>
    </label>
  </div>
  <p id="traversable-note" class="traversable-note hidden" aria-hidden="true">
    This component is traversed and is not exported. Measurement rules belong to the components inside it.
  </p>
  <template id="rules-template">
    <div class="rules-block collapsed">
      <div class="rules-block-header" role="button" tabindex="0">
        <span class="rules-block-summary">
          <span class="rules-block-summary-main">— / — / —</span>
          <span class="rules-block-summary-qty"></span>
        </span>
        <span class="rules-block-toggle" aria-hidden="true">▼</span>
      </div>
      <form>
        <fieldset>
        <input type="hidden" name="ruleset_idx" value="0">
        <label class="free-edit-only" style="display: none;">
          <span>Category</span>
          <input type="text" name="bom_category" style="width: 90px;" value="">
        </label>
        <!-- <legend>BOM ruleset</legend> -->
        <label>
          <span>Code</span>
          <div class="catalog-search-wrap">
            <input type="text" name="bom" style="width: 100%;" autocomplete="off"
              onkeyup="searchCatalogViaApi(this)" onfocus="searchCatalogViaApi(this)" onblur="hideCatalogDropdown(); validateCodeOnBlur(this);">
            <ul id="catalog-dropdown" class="catalog-dropdown" style="display: none;"></ul>
          </div>
        </label>
        <label>
          <span>Label</span>
          <input type="text" name="bom_label" style="width: 70px;">
        </label>
        <label>
          <span>Unit of measure</span>
          <select name="bom_uom">
            <option value="pcs">pcs</option>
            <option value="area">m²</option>
            <option value="length">m</option>
            <option value="volume">m³</option>
            <option value="custom">custom</option>
          </select>
        </label>
        <label>
          <span>Measurement</span>
          <select name="bom_measure">
            <option value="">Select measure</option>
            <option value="count">Count</option>
            <option value="top_area">Top area</option>
            <option value="bottom_area">Bottom area</option>
            <option value="front_area">Front area</option>
            <option value="back_area">Back area</option>
            <option value="left_area">Left area</option>
            <option value="right_area">Right area</option>
            <option value="total_area">Total area</option>
            <option value="material_area">Material area</option>
            <option value="top_perimeter">Top perimeter</option>
            <option value="bottom_perimeter">Bottom perimeter</option>
            <option value="front_perimeter">Front perimeter</option>
            <option value="back_perimeter">Back perimeter</option>
            <option value="left_perimeter">Left perimeter</option>
            <option value="right_perimeter">Right perimeter</option>
            <!-- <option value="edge_length">Edge length</option> -->
            <option value="smart_length">Length</option>
            <option value="bbox_volume">BBox volume</option>
            <option value="bbox_dimensions">BBox dimensions</option>
          </select>
        </label>
        <label class="measure-param measure-param--material" style="display: none;">
          <span>Material</span>
          <select name="bom_param_material">
            <option value="">Select material</option>
          </select>
        </label>
        <label title="Multiplies the measured quantity. Use 2 for two hinges on one door, or 1.1 to add 10% waste. Default is 1.">
          <span>Multiplier</span>
          <input type="number" name="bom_multiplier" min="0" step="any" value="1">
        </label>
        <label>
          <span>Rounding mode</span>
          <select name="bom_rounding_mode">
            <option value="none">None</option>
            <option value="ceil">Ceil</option>
            <option value="floor">Floor</option>
            <option value="round">Round</option>
          </select>
        </label>
        <label>
          <span>Rounding step</span>
          <input type="number" name="bom_rounding_step" style="width: 70px;" value="0.01">
        </label>
        <div class="rule-preview" aria-live="polite" title="Quantity for the selected component, using this measurement, multiplier, and rounding. Extra copies of the same component are totaled the same way as the BOM export.">
          <span class="rule-preview-label">Preview</span>
          <div class="rule-preview-value">—</div>
        </div>

        <button type="button" class="btn-delete-item" onclick="var f=this.form; var b=f.closest('.rules-block'); setDirty(f); if(b) b.remove(); var c=document.getElementById('rules-container'); if(c&&c.querySelectorAll('form').length===0) ensureEmptyRulesPlaceholder(c); scheduleAutoSave();">❌ Delete</button>
      </fieldset>
      </form>
    </div>
  </template>
  <div id="rules-container">
    
  </div>
  <div id="catalog-debug" class="catalog-debug" hidden>
    <div id="catalog-debug-panel" class="catalog-debug-panel">
      <div id="catalog-debug-status" class="catalog-debug-status"></div>
      <div class="catalog-debug-actions">
        <button type="button" onclick="clearCatalogDebug()">Clear</button>
      </div>
      <pre id="catalog-debug-log"></pre>
    </div>
  </div>
  <!-- <script src="devtools.js"></script> -->
  <script src="jquery.js"></script>
  <script src="api_adapter.js"></script>
  <script src="unit_map.js"></script>
  <script src="catalog_search.js"></script>
  <script src="rules.js"></script>
</body>
</html>
